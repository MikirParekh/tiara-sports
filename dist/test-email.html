<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Email - Tiara Sports</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #dc2626;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #999;
            margin-bottom: 20px;
            font-size: 14px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            color: #ccc;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #dc2626;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #b91c1c;
        }
        .note {
            background: #dc2626;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Email Test Page</h1>
        <p>Test karo ke email aa rahi che ke nahi</p>
        
        <div class="note">
            <strong>⚠️ Important:</strong> First time form submit karya pachhi FormSubmit.co na confirmation page ma "Activate" button click karo. Pachhi automatic email aavse.
        </div>

        <form action="https://formsubmit.co/harshil@uniqtechsolutions.com" method="POST">
            <label>Name:</label>
            <input type="text" name="name" placeholder="Your Name" required>

            <label>Email:</label>
            <input type="email" name="email" placeholder="your@email.com" required>

            <label>Phone:</label>
            <input type="tel" name="phone" placeholder="9825088900" required>

            <label>Message:</label>
            <textarea name="message" rows="4" placeholder="Test message..." required></textarea>

            <input type="hidden" name="_subject" value="[TEST] Tiara Sports Email Test">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <button type="submit">Send Test Email</button>
        </form>
    </div>
</body>
</html>
